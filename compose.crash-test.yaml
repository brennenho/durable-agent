# Opt in with: docker compose -f compose.yaml -f compose.crash-test.yaml ...
x-crash-test-environment: &crash-test-environment
  CRASH_TEST_HOOK_URL: ${CRASH_TEST_HOOK_URL:?Set the Crash Test controller hook URL}
  CRASH_TEST_HOOK_TOKEN: ${CRASH_TEST_HOOK_TOKEN:-}
  CRASH_TEST_HOOK_TIMEOUT_SECONDS: ${CRASH_TEST_HOOK_TIMEOUT_SECONDS:-10}

services:
  control:
    extra_hosts: ["host.docker.internal:host-gateway"]
    labels: {durable-agent.crash-test: "true"}
    environment: *crash-test-environment
  tools:
    extra_hosts: ["host.docker.internal:host-gateway"]
    labels: {durable-agent.crash-test: "true"}
    environment: *crash-test-environment
  worker:
    extra_hosts: ["host.docker.internal:host-gateway"]
    labels: {durable-agent.crash-test: "true"}
    environment: *crash-test-environment
  db:
    labels: {durable-agent.crash-test: "true"}
  frontend:
    labels: {durable-agent.crash-test: "true"}
